spring:
  application:
    name: NasaProject
  main:
    banner-mode: off
server:
  port: ${PORT:9090}
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false
    include-binding-errors: never
  max-http-request-header-size: 16KB
  tomcat:
    max-swallow-size: 64KB
    threads:
      max: 50
mars:
  grid-file: data/grid.geojson
  layers-file: data/trek_layers.csv
  import-if-missing: true
  max-concurrent-searches: 4
  max-body-bytes: 8192
  cors:
    allowed-origins: http://localhost:5173,https://*.vercel.app
